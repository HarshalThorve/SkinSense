# ============================================
# SkinSense — Render Deployment Configuration
# ============================================
# This file configures automatic deployment on Render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: skinsense
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y tesseract-ocr || true
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.6"
